<mat-toolbar>
  <mat-toolbar-row>
    <app-review-header [title]="title()" (close)="onClose()" />
  </mat-toolbar-row>
</mat-toolbar>
<div class="actions">
  <app-article-score-block [score]="score()" />
  <app-review-buttons [result]="reviewResult()" (select)="selectResult($event)" />
  <app-article-last-result-block [lastResult]="lastReviewResult()" />
</div>
<div class="topics">
    @for (topic of articleTopics(); track $index) {
      <app-tag [topic]="topic" />
    }
</div>
<div class="markdown-body" [class]="themeClass()">
  <markdown mermaid katex [data]="articleContent()"></markdown>
</div>
